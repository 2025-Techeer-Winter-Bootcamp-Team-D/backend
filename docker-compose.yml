services:
  db:
    image: timescale/timescaledb:latest-pg16
    container_name: postgres-timescaledb
    env_file:
      - .env
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-postgres}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - TZ=Asia/Seoul
    command: ["postgres", "-c", "timezone=Asia/Seoul"]
    networks:
      - django-network
    ports:
      - 5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: redis
    networks:
      - django-network
    ports:
      - 6379:6379
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  opensearch:
    build: ./opensearch
    container_name: opensearch
    env_file:
      - .env
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - plugins.security.disabled=${OPENSEARCH_SECURITY_DISABLED:-true}
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_INITIAL_ADMIN_PASSWORD:-admin123!@#}
    networks:
      - django-network
    ports:
      - 9200:9200
      - 9600:9600
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  app:
    build: .
    container_name: django
    env_file:
      - .env
    ports:
      - 8000:8000
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-postgres}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - OPENSEARCH_HOST=opensearch:9200
    networks:
      - django-network
    develop:
      watch:
        - path: ./config
          target: config/
          action: sync+restart
        - path: ./core
          target: core/
          action: sync+restart
        - path: ./companies
          target: /app/companies/
          action: sync+restart
        - path: ./industries
          target: /app/industries/
          action: sync+restart
        - path: ./requirements.txt
          action: rebuild

  kis-mock-server:
    build: ./kis-publisher
    container_name: kis-mock-server
    command: python mock_server.py
    ports:
      - "8080:8080"
    environment:
      - TZ=Asia/Seoul
    networks:
      - django-network
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.socket(); s.connect(('localhost', 8080)); s.close()"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s

  kis-publisher:
    build: ./kis-publisher
    container_name: kis-publisher
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
      - PYTHONUNBUFFERED=1
      - KRX_SYMBOLS_CSV_PATH=/app/companies_data.csv
      - KIS_SYMBOL_LIMIT=10
      - KIS_USE_TEST_MODE=false
      - KIS_TEST_WS_URL=ws://kis-mock-server:8080
      - KIS_MAX_RECONNECT=3
    depends_on:
      redis:
        condition: service_healthy
      kis-mock-server:
        condition: service_healthy
    networks:
      - django-network
    restart: on-failure
    deploy:
      restart_policy:
        condition: on-failure
        max_attempts: 3

  persistence-worker:
    build: ./persistence-worker
    container_name: persistence-worker
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-postgres}
      - PYTHONUNBUFFERED=1
      - TZ=Asia/Seoul
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    networks:
      - django-network
    restart: always

  celery-worker:
    build: .
    container_name: celery-worker
    env_file:
      - .env
    command: celery -A config worker --loglevel=info
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-postgres}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - OPENSEARCH_HOST=opensearch:9200
      - PYTHONUNBUFFERED=1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    networks:
      - django-network
    restart: always

  celery-beat:
    build: .
    container_name: celery-beat
    env_file:
      - .env
    command: celery -A config beat --loglevel=info
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-postgres}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - PYTHONUNBUFFERED=1
      # 배치 작업 활성화 설정
      # Gemini 토큰 사용하는 작업은 기본 비활성화
      - NEWS_BATCH_ENABLED=${NEWS_BATCH_ENABLED:-false}
      - DART_SYNC_ENABLED=${DART_SYNC_ENABLED:-true}
      - REPORT_PROCESSING_ENABLED=${REPORT_PROCESSING_ENABLED:-false}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - django-network
    restart: always

  flower:
    build: .
    container_name: celery-flower
    env_file:
      - .env
    command: celery -A config flower --port=5555 --broker=redis://redis:6379/0
    ports:
      - 5555:5555
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - PYTHONUNBUFFERED=1
    depends_on:
      redis:
        condition: service_healthy
      celery-worker:
        condition: service_started
    networks:
      - django-network
    restart: always

  subscribe-handler:
    build: .
    container_name: subscribe-handler
    env_file:
      - .env
    command: python manage.py subscribe_handler
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-postgres}
      - REDIS_URL=redis://redis:6379/0
      - PYTHONUNBUFFERED=1
    depends_on:
      redis:
        condition: service_healthy
      app:
        condition: service_healthy
    networks:
      - django-network
    restart: always

volumes:
  postgres_data:
  redis_data:
  opensearch_data:
networks:
  django-network:
    driver: bridge