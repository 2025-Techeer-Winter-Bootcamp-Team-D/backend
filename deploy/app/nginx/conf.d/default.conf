# Upstream 정의
# Daphne 서버 (HTTP + WebSocket 통합 처리)
upstream backend_server {
    server app:8000;
}

# 모니터링 도구
upstream flower_server {
    server flower:5555;
}

upstream grafana_server {
    server grafana:3000;
}

server {
    listen 80;
    server_name localhost;
    
    # Docker 내부 DNS 서버 (변수 사용 시 필수)
    resolver 127.0.0.11 valid=30s;

    # 공통 Proxy 헤더 설정
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 1. Django API 및 일반 HTTP 요청
    location / {
        set $target_app "backend_server";
        proxy_pass http://$target_app;
    }

    # 2. WebSocket 요청 처리 (Daphne/Channels)
    # [수정] subscribe-handler가 아닌 실제 서버인 app으로 전달합니다.
    location /ws/ {
        set $target_ws "backend_server";
        proxy_pass http://$target_ws;
        
        # WebSocket 필수 프로토콜 업그레이드 헤더
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # 연결 타임아웃 확장 (퀀트 데이터 스트리밍 안정성 확보)
        proxy_read_timeout 86400;
    }

    # 3. Grafana 모니터링
    # [수정] 끝에 /를 붙여 경로 프루닝(Pruning) 처리
    location /grafana/ {
        set $target_grafana "grafana_server";
        proxy_pass http://$target_grafana/;
    }

    # 4. Celery Flower 모니터링
    location /celery-flower/ {
        set $target_flower "flower_server";
        proxy_pass http://$target_flower/;
    }

    # 5. 정적 및 미디어 파일 (이미지 내부에 구워진 경로 사용)
    location /static/ {
        alias /app/static/;
    }

    location /media/ {
        alias /app/media/;
    }
    
    # 6. Nginx 상태 확인 (Prometheus 용)
    location /stub_status {
        stub_status;
        allow all;
    }
}