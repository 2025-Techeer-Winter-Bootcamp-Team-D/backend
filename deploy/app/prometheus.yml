global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'django-app'
    static_configs:
      - targets: ['app:8000']

  - job_name: 'node-exporter-app-layer'
    static_configs:
      - targets: ['node-exporter:9100']

  # Data Layer Targets (Configure in production with actual IPs)
  # - job_name: 'data-node-exporter'
  #   static_configs:
  #     - targets: ['DATE_NODE_IP:9100']
