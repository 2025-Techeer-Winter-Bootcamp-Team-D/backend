services:
  db:
    image: timescale/timescaledb:latest-pg16
    container_name: postgres-timescaledb
    env_file:
      - .env
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-postgres}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - TZ=Asia/Seoul
    command: [ "postgres", "-c", "timezone=Asia/Seoul" ]
    networks:
      - data-network
    ports:
      - "5432:5432"
    volumes:
      - /home/ubuntu/infra-data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-postgres}" ]
      interval: 3s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: always

  redis:
    image: redis:7-alpine
    container_name: redis
    env_file:
      - .env
    command: >
      sh -c ' if [ -z "$$REDIS_PASSWORD" ]; then
        echo "Error: REDIS_PASSWORD is not set. Exiting." && exit 1;
      fi; exec redis-server --maxmemory 768mb --maxmemory-policy allkeys-lru --requirepass "$$REDIS_PASSWORD" '
    networks:
      - data-network
    ports:
      - "6379:6379"
    volumes:
      - /home/ubuntu/infra-data/redis:/data
    healthcheck:
      test: [ "CMD-SHELL", "if [ -z \"$$REDIS_PASSWORD\" ]; then exit 1; fi; redis-cli -a \"$$REDIS_PASSWORD\" ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: always

  opensearch:
    build:
      context: ../..
      dockerfile: opensearch/Dockerfile
    container_name: opensearch
    env_file:
      - .env
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - plugins.security.disabled=false
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_INITIAL_ADMIN_PASSWORD}
    networks:
      - data-network
    ports:
      - "9200:9200"
      - "9600:9600"
    volumes:
      - /home/ubuntu/infra-data/opensearch:/usr/share/opensearch/data
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: [ "CMD-SHELL", "curl -k -f -u admin:${OPENSEARCH_INITIAL_ADMIN_PASSWORD} https://localhost:9200/_cluster/health || exit 1" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: always

  # Monitoring Exporters
  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    ports:
      - "9100:9100"
    networks:
      - data-network
    restart: always

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: postgres-exporter
    environment:
      - DATA_SOURCE_NAME=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-postgres}?sslmode=disable
    ports:
      - "9187:9187"
    networks:
      - data-network
    depends_on:
      db:
        condition: service_healthy
    restart: always

  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: redis-exporter
    environment:
      - REDIS_ADDR=redis://redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    ports:
      - "9121:9121"
    networks:
      - data-network
    depends_on:
      redis:
        condition: service_healthy
    restart: always

  opensearch-exporter:
    image: prometheuscommunity/elasticsearch-exporter:latest
    container_name: opensearch-exporter
    command:
      - '--es.uri=https://opensearch:9200'
      - '--es.all'
      - '--es.indices'
      - '--es.timeout=30s'
      - '--es.ssl-skip-verify'
    environment:
      - ES_USERNAME=admin
      - ES_PASSWORD=${OPENSEARCH_INITIAL_ADMIN_PASSWORD}
    ports:
      - "9114:9114"
    networks:
      - data-network
    depends_on:
      opensearch:
        condition: service_healthy
    restart: always

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: rabbitmq
    hostname: rabbitmq
    ports:
      - "5672:5672"    # AMQP 포트
      - "15672:15672"  # Management UI 포트
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER:-guest}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD:-guest}
      - RABBITMQ_DEFAULT_VHOST=/
    volumes:
      - /home/ubuntu/infra-data/rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - data-network
    restart: always

  # Portainer Agent (중앙 Portainer에서 원격 관리용)
  portainer-agent:
    image: portainer/agent:latest
    container_name: portainer-agent
    ports:
      - "9001:9001"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes
    networks:
      - data-network
    restart: always

networks:
  data-network:
    driver: bridge
