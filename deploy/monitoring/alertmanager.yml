    #       {{ end }}
    #     send_resolved: true

  # Warning 알림용 Slack
  - name: 'slack-warning'
    # slack_configs:
    #   - api_url: '${SLACK_WEBHOOK_URL}'
    #     channel: '#alerts-warning'
    #     title: '⚠️ WARNING: {{ .GroupLabels.alertname }}'
    #     text: |
    #       {{ range .Alerts }}
    #       *Alert:* {{ .Labels.alertname }}
    #       *Severity:* {{ .Labels.severity }}
    #       *Layer:* {{ .Labels.layer }}
    #       *Instance:* {{ .Labels.instance }}
    #       *Summary:* {{ .Annotations.summary }}
    #       {{ end }}
    #     send_resolved: true

# 알림 억제 규칙 (중복 알림 방지)
inhibit_rules:
  # Critical 알림이 있으면 Warning 알림 억제
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'instance']

  # PostgreSQL Down 시 관련 알림 억제
  - source_match:
      alertname: 'PostgreSQLDown'
    target_match_re:
      alertname: '.*PostgreSQL.*'
    equal: ['instance']

  # Redis Down 시 관련 알림 억제
  - source_match:
      alertname: 'RedisDown'
    target_match_re:
      alertname: '.*Redis.*'
    equal: ['instance']
