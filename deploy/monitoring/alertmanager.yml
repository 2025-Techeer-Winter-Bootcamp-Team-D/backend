global:
  resolve_timeout: 5m
  # Slack webhook URL (환경 변수로 설정)
  # slack_api_url: '${SLACK_WEBHOOK_URL}'

# 알림 라우팅 규칙
route:
  receiver: 'default'
  group_by: ['alertname', 'severity', 'layer']
  group_wait: 30s        # 알림 그룹화 대기 시간
  group_interval: 5m     # 그룹화된 알림 전송 간격
  repeat_interval: 4h    # 동일 알림 반복 간격

  # Severity별 라우팅
  routes:
    # Critical 알림 (즉시 전송)
    - match:
        severity: critical
      receiver: 'slack-critical'
      group_wait: 10s
      repeat_interval: 1h

    # Warning 알림 (그룹화 후 전송)
    - match:
        severity: warning
      receiver: 'slack-warning'
      group_wait: 30s
      repeat_interval: 4h

# 알림 수신자 설정
receivers:
  # 기본 수신자
  - name: 'default'
    # webhook_configs:
    #   - url: 'http://localhost:5001/webhook'

  # Critical 알림용 Slack
  - name: 'slack-critical'
    # Slack 설정 (주석 해제하고 SLACK_WEBHOOK_URL 환경 변수 설정)
