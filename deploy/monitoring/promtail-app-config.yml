server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions-app.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Docker 컨테이너 로그 수집 (App Layer + Monitoring)
  - job_name: docker-app
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s

    relabel_configs:
      # 컨테이너 이름 추출
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container_name'

      # 컨테이너 ID 추출
      - source_labels: ['__meta_docker_container_id']
        regex: '(.*)'
        target_label: 'container_id'

      # Docker Compose 서비스 이름
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'service'

      # Layer 라벨 추가
      - replacement: 'app'
        target_label: 'layer'

    pipeline_stages:
      # JSON 로그 파싱
      - json:
          expressions:
            timestamp: timestamp
            level: level
            message: message
            logger: name

      # 타임스탬프 추출
      - timestamp:
          source: timestamp
          format: '2006-01-02T15:04:05.000Z'

      # 로그 레벨 추출
      - labels:
          level:

      # 레벨별 필터링 (DEBUG 로그 제외)
      - match:
          selector: '{level="DEBUG"}'
          action: drop
